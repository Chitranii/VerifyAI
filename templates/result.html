<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerifyAI — Result</title>

    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="bg-fx">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="navbar">

    <div class="logo"><span class="logo-dot"></span>VerifyAI</div>

    <div class="nav-links">

        <a href="/" class="nav-link">
            Upload
        </a>

        <a href="/billing" class="nav-link">
            Billing
        </a>

        <a href="/admin" class="nav-link">
            Admin
        </a>

        <div class="credits">
            💠 Credits: <strong>{{ credits }}</strong>
        </div>

    </div>

</div>

<div class="container">

    <div id="resultBox" class="result-box">

        <div class="result-header" id="resultHeader">

            <div class="result-icon" id="resultIcon"></div>

            <div>

                <div class="result-title" id="resultTitle">
                    Analysing...
                </div>

                <div class="result-subtitle" id="resultSubtitle"></div>

            </div>

        </div>

        <div class="confidence-wrap" id="confidenceWrap">
            <div class="confidence-ring">
                <svg width="130" height="130">
                    <circle class="track" cx="65" cy="65" r="54" fill="none" stroke-width="10"></circle>
                    <circle class="bar" id="confidenceBar" cx="65" cy="65" r="54" fill="none" stroke-width="10" stroke-dasharray="339.29" stroke-dashoffset="339.29"></circle>
                </svg>
                <div class="confidence-value">
                    <div class="confidence-num" id="confidenceNum">0%</div>
                    <div class="confidence-label">CONFIDENCE</div>
                </div>
            </div>
        </div>

        <div class="result-summary" id="resultSummary"></div>

        <div class="checks-grid" id="checksGrid"></div>

        {% if credits < 5 %}
        <div class="low-credits-banner">

            ⚠ You only have {{ credits }} credits left!

            <a href="/billing" class="low-credits-link">
                Top up now →
            </a>

        </div>
        {% endif %}

        <div class="result-footer">

            <span class="charge-badge">
                ₹40 charged
            </span>

            <div class="result-actions">

                <a href="/billing" class="plan-btn result-credits-btn">
                    💳 Buy More Credits
                </a>

                <a href="/" class="verify-another">
                    Verify another document →
                </a>

            </div>

        </div>

    </div>

</div>

<script>

    const savedResult = localStorage.getItem('verifyResult');

    if (!savedResult) {

        alert('No verification result found.');

        window.location.href = '/';
    }

</script>

<script src="/static/common.js"></script>
<script src="/static/result.js"></script>

</body>
</html>
