<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VerifyAI — Document Verification</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="navbar">
    <div class="logo">VerifyAI</div>

    <div class="nav-links">
        <a href="/" class="nav-link active">Upload</a>
        <a href="/billing" class="nav-link">Billing</a>
        <a href="/admin" class="nav-link">Admin</a>

        <div class="credits">
            Credits: <strong>{{ credits }}</strong>
        </div>
    </div>
</div>

<div class="container">

    <h1>Upload Document for Verification</h1>

    <p class="subtitle">
        AI-powered authenticity check in seconds
    </p>

    <form id="uploadForm" enctype="multipart/form-data">

        <div class="doc-type-selector">

            <label>
                Document Type:
            </label>

            <select name="doc_type" id="docType" required title="Document Type">

                <optgroup label="Indian Documents">
                    <option value="aadhaar_card">Aadhaar Card</option>
                    <option value="pan_card">PAN Card</option>
                    <option value="voter_id">Voter ID</option>
                    <option value="driving_licence">Driving Licence</option>
                    <option value="passport">Passport</option>
                </optgroup>

                <optgroup label="Financial Documents">
                    <option value="bank_statement">Bank Statement</option>
                    <option value="salary_slip">Salary Slip</option>
                    <option value="itr">Income Tax Return (ITR)</option>
                </optgroup>

                <optgroup label="Other">
                    <option value="utility_bill">Utility Bill</option>
                    <option value="rent_agreement">Rent Agreement</option>
                </optgroup>

            </select>
        </div>

        <div class="upload-zone" id="uploadZone">

            <div class="upload-icon">⬆</div>

            <div class="upload-text">
                Drop your file here or click to browse
            </div>

            <div class="upload-sub">
                Supports JPG, JPEG, PNG — max 5MB
            </div>

            <input
                type="file"
                id="fileInput"
                name="document"
                accept=".jpg,.jpeg,.png"
                hidden
                required
            >

        </div>

        <div class="file-info" id="fileInfo">
            <span id="fileName"></span>

            <span class="remove-file" onclick="removeFile()">
                ✕ Remove
            </span>
        </div>

        <button
            type="submit"
            class="verify-btn"
            id="verifyBtn"
            disabled
        >
            Verify Document — $0.49
        </button>

    </form>

</div>

<script src="/static/script.js"></script>

</body>
</html>
